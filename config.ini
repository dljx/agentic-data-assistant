# config.ini

# Configuration file for the Agentic Data Assistant.

[GCP]
# Google Cloud Platform settings.
# Set your GCP project ID here or use the GCP_PROJECT_ID environment variable.
project_id = your-gcp-project

[BIGQUERY]
# BigQuery connection settings.
bq_dataset_region = us-central1

# The dataset containing the primary data tables.
bq_dataset_name = your_dataset

investors_table_name = investors_table
companies_table_name = companies_table